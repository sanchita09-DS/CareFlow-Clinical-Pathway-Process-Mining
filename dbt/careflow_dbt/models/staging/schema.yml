version: 2

models:
  - name: stg_patient_events
    description: "Staging model for CareFlow patient clinical events."

    columns:
      - name: case_ID
        description: "Unique identifier for a clinical case."
        data_tests:
          - not_null

      - name: activity_Name
        description: "Clinical activity performed during the patient journey."
        data_tests:
          - not_null

      - name: event_timestamp
        description: "Date and time when the clinical activity occurred."
        data_tests:
          - not_null